    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #eaf5f3; /* 기존 도구들과 동일한 민트 배경 */
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);

        }

            color: #64748b;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-link {
            display: block;
            padding: 18px 20px;
            background-color: #4b86f7;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(75, 134, 247, 0.2);
        }

        .menu-link:hover {
            background-color: #3b76e7;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(75, 134, 247, 0.3);
        }

        /* 각 버튼 색상을 다르게 주고 싶다면 아래 주석을 해제하고 사용하세요 */
