<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #eaf5f3; /* 기존 도구들과 동일한 민트 배경 */
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* 두 상자를 가로로 묶어주는 래퍼(Wrapper) 스타일 추가 */
        .tools-wrapper {
            display: flex;
            gap: 40px; /* 두 상자 사이의 간격 */
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap; /* 화면이 좁아지면 자동으로 아래로 내려가게 함 */
            width: 100%;
            max-width: 1100px; /* 너무 넓어지지 않게 최대 너비 설정 */
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
            /* 상자가 wrapper 안에서 적절한 크기를 갖도록 설정 */
            box-sizing: border-box; 
        }

        h1 {
            color: #1e293b;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.8rem;
            letter-spacing: -1px;
        }

        p {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-link {
            display: block;
            padding: 18px 20px;
            background-color: #4b86f7;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 8px;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(75, 134, 247, 0.2);
        }

        .menu-link:hover {
            background-color: #3b76e7;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(75, 134, 247, 0.3);
        }

        /* 각 버튼 색상을 다르게 주고 싶다면 아래 주석을 해제하고 사용하세요 */
        /*
        .menu-link:nth-child(1) { background-color: #6366f1; }
        .menu-link:nth-child(2) { background-color: #4ade80; color: #166534; }
        .menu-link:nth-child(3) { background-color: #f43f5e; }
        */
    </style>
</head>

            <div class="menu-list">

            <div class="menu-list">
                <a href="Print Student Score Reports.html" class="menu-link" target="_blank">1. 학생별 정오표 전체 출력</a>
                <a href="Randomize order.html" class="menu-link" target="_blank">2. 랜덤 순서 뽑기</a>
                <a href="ImagSize.html" class="menu-link" target="_blank">3. 이미지 사이즈 변경</a>
                <a href="Image.html" class="menu-link" target="_blank">4. 원서용 사진</a>
            </div>
        </div>

        <div class="container">
            <h1>🎵 삼각함수와 소리</h1>

            </div>
        </div>

    </div>

</body>
</html>
